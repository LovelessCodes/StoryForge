pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bun fmt && bun lint
      stage_fixed: true
    fmt:
      glob: "*.{rs}"
      run: cd src-tauri && cargo fmt
      stage_fixed: true
    branch-guard:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        case "$branch" in
          release|main|master)
            echo "⚠️  Committing directly to '$branch' — this repo merges via pull requests."
            ;;
        esac
