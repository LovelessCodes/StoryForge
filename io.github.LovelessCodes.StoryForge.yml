# Self-hosted Flatpak bundle, built by .github/workflows/build_flatpak.yml and
# attached to GitHub releases. Deps are offline: node_modules-x64.tar.gz is
# bundled by the workflow (local source) and Rust crates come from
# packaging/flatpak/cargo-sources.json. The Flathub-ready variant lives in
# packaging/flatpak/.

app-id: io.github.LovelessCodes.StoryForge
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: /app/StoryForge/StoryForge
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --filesystem=xdg-documents
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: bun
    buildsystem: simple
    build-commands:
      - install -Dm755 bun ${FLATPAK_DEST}/bin/bun
      - install -Dm644 LICENSE.md ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/bun/LICENSE.md
    sources:
      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip
        sha256: 36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913
        strip-components: 1
      - type: file
        url: https://raw.githubusercontent.com/oven-sh/bun/bun-v1.4.2/LICENSE.md
        sha256: b9caf52728691b4057e371232c221a132883198be2f3d2ddf92c90404c984b1a

  - name: StoryForge
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/LovelessCodes/StoryForge.git
        branch: release
      - type: file
        path: io.github.LovelessCodes.StoryForge.desktop
      - type: file
        path: io.github.LovelessCodes.StoryForge.metainfo.xml
      - type: file
        path: src-tauri/icons/icon.png
        dest-filename: io.github.LovelessCodes.StoryForge.png
      # Bundled by the node_modules job in build_flatpak.yml.
      - type: archive
        path: node_modules-x64.tar.gz
      # Generated from src-tauri/Cargo.lock; see packaging/flatpak/README.md.
      - packaging/flatpak/cargo-sources.json
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/StoryForge/cargo
        CARGO_NET_OFFLINE: "true"
        # The SDK's -O2 CFLAGS leak into jitterentropy.c, which must build at
        # -O0. Upstream-recommended workaround; on x86_64 the RNG falls back to
        # getrandom + RDRAND. See https://github.com/aws/aws-lc-rs/issues/1097.
        AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
    build-commands:
      # Substitute version & date in metainfo
      - export VERSION=$(git -C ./*StoryForge* describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
      - export DATE=$(date -u +%Y-%m-%d)
      - sed -i "s|FLATPAK_VERSION|$VERSION|g; s|FLATPAK_DATE|$DATE|g" io.github.LovelessCodes.StoryForge.metainfo.xml
      # Frontend dependencies come pre-installed from the node_modules archive.
      - bun tauri build --no-bundle
      # Install executable
      - install -Dm755 -t /app/StoryForge src-tauri/target/release/StoryForge
      # Install icon
      - install -Dm644 -t /app/share/icons/hicolor/512x512/apps io.github.LovelessCodes.StoryForge.png
      # Install desktop file
      - desktop-file-install --dir=/app/share/applications io.github.LovelessCodes.StoryForge.desktop
      # Install metainfo file
      - install -Dm644 -t /app/share/metainfo io.github.LovelessCodes.StoryForge.metainfo.xml
      # Install license
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/StoryForge/LICENSE
