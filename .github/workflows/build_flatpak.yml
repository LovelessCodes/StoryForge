name: "Build and publish Flatpak"

on:
  workflow_dispatch:
  push:
    tags:
      - "storyforge-v[0-9]+.[0-9]+.[0-9]+"
      - "storyforge-v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

jobs:
  node-modules:
    name: Bundle node_modules
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Pack node_modules
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime='2020-01-01 00:00:00 UTC' \
            -czf node_modules-x64.tar.gz node_modules

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-modules
          path: node_modules-x64.tar.gz
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak
    needs: node-modules
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Read version from package.json
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Update flatpak metainfo version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          DATE=$(date +%Y-%m-%d)
          echo $DATE
          RELEASE=$(echo $VERSION | cut -c 1-)
          echo $RELEASE
          sed -i "s/FLATPAK_VERSION/${RELEASE}/g" io.github.LovelessCodes.StoryForge.metainfo.xml
          sed -i "s/FLATPAK_DATE/${DATE}/g" io.github.LovelessCodes.StoryForge.metainfo.xml

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-modules

      - uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb
        with:
          bundle: io.github.LovelessCodes.StoryForge-v${{ steps.version.outputs.value }}.flatpak
          manifest-path: io.github.LovelessCodes.StoryForge.yml
          # Stable key: the cache is the flatpak-builder build state, reused
          # across releases (bump the suffix to force a cold build).
          cache-key: flatpak-builder-v1

      - name: Upload to GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="storyforge-v${VERSION}"
          FILE=io.github.LovelessCodes.StoryForge-v${VERSION}.flatpak
          if [[ "$VERSION" == *-rc* ]]; then
            BODY="⚠️ Release candidate — not recommended for general use."
            PRERELEASE_FLAG="--prerelease"
          else
            BODY="See the assets to download this version and install."
            PRERELEASE_FLAG=""
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} doesn't exist. Creating draft..."
            gh release create "$TAG" "$FILE" \
              --title "$TAG" \
              --notes "$BODY" \
              --draft \
              $PRERELEASE_FLAG
          else
            echo "Release ${TAG} exists. Uploading asset..."
            gh release upload "$TAG" "$FILE" --clobber
          fi
