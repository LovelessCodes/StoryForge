name: "Nix"

on:
  workflow_dispatch:
  push:
    branches: ["release"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "bun.nix"
      - "nix/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "bun.nix"
      - "nix/**"
      - ".github/workflows/nix.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A full `nix build` compiles the whole app in about 25 minutes, and every
  # commit produces a new derivation, so a shared cache cannot carry a PR
  # between commits. What it does carry is the commit that lands on `release`:
  # `nix run github:LovelessCodes/StoryForge` then substitutes the build most
  # users would otherwise compile themselves. Pull requests that only change the
  # dependency lock get the fast checks below; anything touching the packaging
  # itself still builds fully, and pushes and manual runs always do.
  scope:
    name: Changed files
    runs-on: ubuntu-slim
    outputs:
      full: ${{ steps.detect.outputs.full }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Decide whether the packaging changed
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only FETCH_HEAD HEAD | grep -qE '^(flake\.(nix|lock)|nix/)'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks (evaluate + bun.nix)
    needs: scope
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Skipped until a cache is set up: create one at cachix.org and store its
      # auth token as the CACHIX_AUTH_TOKEN secret (see README → Nix).
      - name: Use the Story Forge binary cache
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: storyforge
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # PR derivations are throwaway; only landable commits get pushed.
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Evaluate the flake for both platforms
        run: |
          nix eval --raw .#packages.x86_64-linux.default.drvPath && echo
          nix eval --raw .#packages.aarch64-darwin.default.drvPath && echo

      - name: Validate the fetched bun dependencies
        # Realising the package cache checks every hash in bun.nix, so a
        # dependency update is validated without compiling the app.
        run: nix build .#bun-deps

  build:
    name: Build (x86_64-linux)
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Use the Story Forge binary cache
        if: env.CACHIX_AUTH_TOKEN != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: storyforge
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ./result
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Lock flake
        run: nix flake lock && cat flake.lock

      - name: Build
        run: nix build .# --print-build-logs --accept-flake-config

      - name: Verify binary
        run: test -x ./result/bin/StoryForge
