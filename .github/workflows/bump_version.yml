name: 'publish'

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v5

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: bump version in package.json, Cargo.toml, and tauri.conf.json
        id: bump_version
        run: |
          # Get the new version from the tag that triggered the workflow
          if [[ "${GITHUB_REF}" =~ refs/tags/v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            NEW_VERSION="${BASH_REMATCH[1]}"
            echo "New version from tag: $NEW_VERSION"
          else
            echo "Error: This workflow must be triggered by a tag in the format vX.Y.Z"
            exit 1
          fi

          # Update version in package.json
          jq --arg ver "$NEW_VERSION" '.version = $ver' package.json > package.tmp.json && mv package.tmp.json package.json
          echo "Updated package.json to version $NEW_VERSION"

          # Update version in src-tauri/tauri.conf.json
          TAURI_CONFIG_PATH="./src-tauri/tauri.conf.json"
          if [ ! -f "$TAURI_CONFIG_PATH" ]; then
            echo "Error: $TAURI_CONFIG_PATH not found."
            exit 1
          fi
          jq --arg ver "$NEW_VERSION" '.version = $ver' "$TAURI_CONFIG_PATH" > tauri.tmp.json && mv tauri.tmp.json "$TAURI_CONFIG_PATH"
          echo "Updated tauri.conf.json to version $NEW_VERSION"

          # Update version in src-tauri/Cargo.toml using cargo set-version
          cd src-tauri
          cargo install cargo-edit --version "^0.11.0" || true # Install cargo-edit if not already installed
          cargo set-version "$NEW_VERSION"
          echo "Updated Cargo.toml to version $NEW_VERSION"

          # Update version in src-tauri/Cargo.lock to keep it consistent
          cargo generate-lockfile
          echo "Updated Cargo.lock to version $NEW_VERSION"

          # Commit and push changes back to the repository
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin HEAD:release