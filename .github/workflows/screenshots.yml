name: Screenshots

on:
  # Fired when a release draft created by the release workflow is published by
  # hand, plus manual runs from the Actions tab.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  refresh:
    name: Capture and propose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build frontend
        run: bun run build

      - name: Capture light/dark pairs
        run: bun run screenshots:capture

      - name: Composite the committed WebPs
        run: bun run screenshots

      - name: Propose updated screenshots
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: release
          add-paths: screenshots
          branch: chore/refresh-screenshots
          delete-branch: true
          commit-message: >-
            chore(screenshots): refresh for
            ${{ github.event.release.tag_name || 'manual run' }}
          title: >-
            chore(screenshots): refresh for
            ${{ github.event.release.tag_name || 'manual run' }}
          body: |
            Automated README screenshot refresh for
            `${{ github.event.release.tag_name || github.sha }}`.

            Captured headlessly with Playwright against the built frontend, with
            Tauri IPC stubbed by `scripts/screenshots/fixtures.ts`. The light and
            dark pairs were composited into the committed WebP files by
            `scripts/screenshots.ts`.

            Review the images and merge when the pages look right.
