name: "Release to Discord"

on:
  release:
    types: [published]

jobs:
  github-releases-to-discord:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Github Releases"
          avatar_url: "https://getstoryforge.app/StoryForge.png"
          footer_title: "Changelog"
          footer_icon_url: "https://getstoryforge.app/StoryForge.png"
          reduce_headings: true
