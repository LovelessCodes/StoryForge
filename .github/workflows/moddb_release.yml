name: "Publish to VS ModDB"

# Uploads published GitHub releases to mods.vintagestory.at/storyforge.
#
# The ModDB has no write API, so this replays the web form with a session
# cookie stored as the MODDB_COOKIE secret (see scripts/moddb-upload-release.ts).
#
# Recommended setup:
#   Settings → Environments → create "moddb"
#     • secret MODDB_COOKIE = cookie header for mods.vintagestory.at
#     • optionally restrict deployment branches to release/main
#   If the cookie expires, the run fails with a clear message — refresh it by
#   logging in at mods.vintagestory.at, copying the `Cookie` request header
#   from the browser devtools, and updating the secret.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. storyforge-v2.0.2)"
        required: true
        type: string
      dry_run:
        description: "Validate everything without uploading"
        type: boolean
        default: false
      force:
        description: "Upload even if the version already exists on ModDB"
        type: boolean
        default: false

concurrency:
  group: moddb-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'storyforge-v') }}
    runs-on: ubuntu-latest
    environment: moddb
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Ensure zip is available
        run: |
          if ! command -v zip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi

      - name: Upload release to VS ModDB
        shell: bash
        env:
          MODDB_COOKIE: ${{ secrets.MODDB_COOKIE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--tag "$TAG")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$FORCE" = "true" ] && args+=(--force)
          bun scripts/moddb-upload-release.ts "${args[@]}"

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          [ -n "$WEBHOOK_URL" ] && curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"content":"⚠️ ModDB upload failed — check the run (expired cookie?)"}' || true
