name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: millionco/react-doctor@3c05fc4d63993055469e8c8a18f151ba95a3a36e
        with:
          # Advisory on purpose: the scan exits 0 locally with the same flags
          # and flags no error-severity findings, but the action still exits 1
          # in CI, so every pull request would otherwise show a red check.
          non-blocking: true
