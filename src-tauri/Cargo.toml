[package]
name = "StoryForge"
version = "0.6.2"
description = "Launcher for Vintage Story"
authors = ["lovelesscodes"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
incremental = true
debug = 2
opt-level = 1
lto = false
codegen-units = 16

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
debug = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "story_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-zustand = "1"
tauri-plugin-window-state = "2"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.39", default-features = false, features = ["serialize"] }
which = "8"
zip = { version = "8", default-features = false, features = ["deflate"] }
futures-util = "0.3"
zip-extensions = "0.13"
walkdir = "2"
dunce = "1"
prost = "0.14.3"
json5 = "1.3.1"
image = { version = "0.25", default-features = false, features = ["png"] }
fs_extra = "1.3.0"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
rusqlite = { version = "0.38", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
rusqlite = "0.38"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
